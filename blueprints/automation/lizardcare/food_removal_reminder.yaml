blueprint:
  name: Lizard Care — Food Removal Reminder
  description: >
    Notify immediately when Lizard Care reports that food is due for removal,
    then repeat on due-time-anchored boundaries within a daily notification
    window while Food Removal Status remains due or overdue.
  domain: automation
  author: Lizard Care
  source_url: https://github.com/NolanBecker/ha-lizardcare/blob/main/blueprints/automation/lizardcare/food_removal_reminder.yaml
  homeassistant:
    min_version: 2024.10.0
  input:
    food_removal_status:
      name: Food Removal Status sensor
      selector:
        entity:
          filter:
            domain: sensor
    remove_food_button:
      name: Remove Food button
      description: Optional. Required to show the Mark Food Removed action.
      default: ""
      selector:
        entity:
          filter:
            domain: button
    notification_target:
      name: Legacy notification target (unused)
      description: >
        Retained so existing automations load. Configure Companion notification
        services below instead.
      default: {}
      selector:
        target:
          entity:
            domain: notify
    notification_services:
      name: Companion notification services
      description: >
        Add one fully qualified service per recipient, such as
        notify.mobile_app_nolans_phone. Each service receives the same
        actionable notification.
      default: []
      selector:
        text:
          multiple: true
    vacation_calendar:
      name: Vacation calendar
      description: >
        Optional. Active events on this calendar suppress notifications at
        their actual start/end times. Leave blank to disable Vacation Mode.
      default: ""
      selector:
        entity:
          filter:
            domain: calendar
    reminder_time:
      name: Reminder time / schedule anchor
      description: >
        Start of the daily recurring-reminder window. Set this to the same
        local time as the integration's Food removal anchor time.
      default: "19:00:00"
      selector:
        time:
    overdue_reminder_end_time:
      name: Overdue reminder end time
      description: >
        Inclusive local time when recurring reminders stop. Earlier times
        create a window across midnight.
      default: "23:00:00"
      selector:
        time:
    food_removal_repeat_interval:
      name: Food removal repeat interval
      description: Numeric interval between recurring removal reminders.
      default: 1
      selector:
        number:
          min: 1
          max: 10080
          step: 1
          mode: box
    food_removal_repeat_interval_unit:
      name: Food removal repeat interval unit
      default: hours
      selector:
        select:
          options:
            - label: Minutes
              value: minutes
            - label: Hours
              value: hours
          mode: dropdown
    completion_notifications_enabled:
      name: Send completion notifications
      description: >
        Replace the active reminder with a completion confirmation. When off,
        completing food removal clears the stale reminder instead.
      default: true
      selector:
        boolean:
    completion_message:
      name: Food Removal completion message
      description: Optional. Leave blank to use the contextual default.
      default: ""
      selector:
        text:
          multiline: true
    pet_name_override:
      name: Pet name override
      description: >
        Optional. When blank, the blueprint uses the Lizard Care device name.
      default: ""
      selector:
        text:
    notification_title:
      name: Notification title
      description: Optional. Leave blank to use the built-in title.
      default: ""
      selector:
        text:
    notification_message:
      name: Notification message
      description: Optional. Leave blank to use the standard message.
      default: ""
      selector:
        text:
          multiline: true
    dashboard_url:
      name: Dashboard URL
      description: Relative Home Assistant URL opened when the notification is tapped.
      default: /mobile-dashboard/pixel
      selector:
        text:

triggers:
  - trigger: state
    entity_id: !input food_removal_status
    to: due
    id: due
  - trigger: state
    entity_id: !input food_removal_status
    from: pending
    to: overdue
    id: overdue
  - trigger: state
    entity_id: !input food_removal_status
    from: not_needed
    to: overdue
    id: overdue
  - trigger: state
    entity_id: !input food_removal_status
    from: due
    to: overdue
    id: overdue_progression
  - trigger: time
    at: !input reminder_time
    id: reminder_boundary
  - trigger: time_pattern
    minutes: "*"
    id: overdue_repeat
  - trigger: homeassistant
    event: start
    id: startup
  - trigger: event
    event_type: mobile_app_notification_action
    id: notification_action
  - trigger: event
    event_type: lizardcare_care_completed
    id: care_completed

variables:
  status_entity: !input food_removal_status
  remove_food_button_entity: !input remove_food_button
  configured_reminder_time: !input reminder_time
  configured_overdue_end_time: !input overdue_reminder_end_time
  repeat_value: !input food_removal_repeat_interval
  repeat_unit: !input food_removal_repeat_interval_unit
  repeat_interval_minutes: >
    {{ repeat_value | int * 60
       if repeat_unit == 'hours'
       else repeat_value | int }}
  due_at_value: "{{ state_attr(status_entity, 'due_at') }}"
  minutes_from_due_boundary: >
    {% set due_at = as_datetime(due_at_value, none) %}
    {% if due_at is none %}
      {{ none }}
    {% else %}
      {% set local_due = as_local(due_at) %}
      {{ now().toordinal() * 1440 + now().hour * 60 + now().minute -
         (local_due.toordinal() * 1440 +
          local_due.hour * 60 + local_due.minute) }}
    {% endif %}
  is_repeat_boundary: >
    {{ minutes_from_due_boundary is not none and
       minutes_from_due_boundary | int >= 0 and
       minutes_from_due_boundary | int % repeat_interval_minutes | int == 0 }}
  is_within_overdue_window: >
    {% set start = today_at(configured_reminder_time) %}
    {% set end = today_at(configured_overdue_end_time) %}
    {% set current_minutes = now().hour * 60 + now().minute %}
    {% set start_minutes = start.hour * 60 + start.minute %}
    {% set end_minutes = end.hour * 60 + end.minute %}
    {{ start_minutes <= current_minutes <= end_minutes
       if start_minutes <= end_minutes
       else current_minutes >= start_minutes or current_minutes <= end_minutes }}
  automation_ran_this_minute: >
    {% set last_run = as_timestamp(this.attributes.last_triggered, 0) %}
    {{ last_run > 0 and
       (last_run / 60) | int == (as_timestamp(now()) / 60) | int }}
  title_text: !input notification_title
  configured_dashboard_url: !input dashboard_url
  notification_service_list: !input notification_services
  configured_message: !input notification_message
  configured_pet_name: !input pet_name_override
  send_completion_notifications: !input completion_notifications_enabled
  configured_completion_message: !input completion_message
  vacation_calendar_entity: !input vacation_calendar
  pet_name: >
    {{ configured_pet_name | trim
       or device_attr(device_id(status_entity), 'name')
       or 'Your pet' }}
  message_text: >
    {{ configured_message | trim
       or pet_name ~ "'s food is ready to be removed." }}
  removal_action_id: >
    LIZARD_CARE_{{ this.entity_id | replace('.', '_') | upper }}_REMOVE_FOOD
  pet_config_entry_id: "{{ config_entry_id(status_entity) or '' }}"
  food_removal_notification_tag: >
    lizardcare_{{ pet_config_entry_id or
      (device_id(status_entity) or status_entity) | replace('.', '_') }}_food_removal

conditions:
  - condition: template
    value_template: >
      {{ trigger.id == 'notification_action' or
         trigger.id == 'care_completed' or
         states(status_entity) in ['due', 'overdue'] }}

actions:
  - choose:
      - conditions: >
          {{ trigger.id == 'notification_action' and
             remove_food_button_entity | trim != '' and
             trigger.event.data.action == removal_action_id }}
        sequence:
          - action: button.press
            target:
              entity_id: "{{ remove_food_button_entity }}"
  - condition: template
    value_template: "{{ trigger.id != 'notification_action' }}"
  - choose:
      - conditions: >
          {{ trigger.id == 'care_completed' and
             trigger.event.data.entry_id == pet_config_entry_id and
             trigger.event.data.task == 'food_removal' }}
        sequence:
          - repeat:
              for_each: "{{ notification_service_list }}"
              sequence:
                - choose:
                    - conditions: "{{ send_completion_notifications }}"
                      sequence:
                        - action: "{{ repeat.item }}"
                          data:
                            title: >
                              {{ title_text | trim or
                                 'Lizard Care — Food Removal' }}
                            message: >
                              {{ configured_completion_message | trim or
                                 pet_name ~ "'s food was removed." }}
                            data:
                              url: "{{ configured_dashboard_url }}"
                              tag: "{{ food_removal_notification_tag }}"
                  default:
                    - action: "{{ repeat.item }}"
                      data:
                        message: clear_notification
                        data:
                          tag: "{{ food_removal_notification_tag }}"
          - stop: Food removal completion handled
  - variables:
      vacation_events_response: {}
      vacation_is_active: false
  - choose:
      - conditions: >
          {{ vacation_calendar_entity | trim != '' and
             states(vacation_calendar_entity) not in
             ['unknown', 'unavailable'] }}
        sequence:
          - action: calendar.get_events
            continue_on_error: true
            target:
              entity_id: "{{ vacation_calendar_entity }}"
            data:
              start_date_time: "{{ now().isoformat() }}"
              end_date_time: >
                {{ (now() + timedelta(minutes=1)).isoformat() }}
            response_variable: vacation_events_response
          - variables:
              vacation_is_active: >
                {% set calendar_result =
                   (vacation_events_response | default({})).get(
                     vacation_calendar_entity, {}) %}
                {% set events = calendar_result.get('events', []) %}
                {% set current = as_timestamp(now()) %}
                {% set ns = namespace(active=false) %}
                {% for event in events %}
                  {% set start = as_timestamp(event.start, none) %}
                  {% set end = as_timestamp(event.end, none) %}
                  {% if start is not none and end is not none and
                        current >= start and current < end %}
                    {% set ns.active = true %}
                  {% endif %}
                {% endfor %}
                {{ ns.active }}
  - condition: template
    value_template: "{{ not vacation_is_active }}"
  - condition: template
    value_template: >
      {% set elapsed = as_timestamp(now()) -
         as_timestamp(states[status_entity].last_changed) %}
      {{ trigger.id in ['due', 'overdue'] or
         (trigger.id == 'overdue_progression' and
          is_within_overdue_window and is_repeat_boundary and
          not automation_ran_this_minute) or
         (trigger.id == 'startup' and is_within_overdue_window and
          not automation_ran_this_minute) or
         (trigger.id in ['reminder_boundary', 'overdue_repeat'] and
          is_within_overdue_window and is_repeat_boundary and
          not automation_ran_this_minute and elapsed >= 60) }}
  - repeat:
      for_each: "{{ notification_service_list }}"
      sequence:
        - action: "{{ repeat.item }}"
          data:
            title: "{{ title_text | trim or 'Lizard Care — Food Removal' }}"
            message: "{{ message_text }}"
            data:
              url: "{{ configured_dashboard_url }}"
              tag: "{{ food_removal_notification_tag }}"
              actions: >
                {{ [{'action': removal_action_id,
                     'title': 'Mark Food Removed'}]
                   if remove_food_button_entity | trim != '' else [] }}

mode: queued
max: 10
max_exceeded: silent
