blueprint:
  name: Lizard Care — Vacation Care Reminder
  description: >
    Send one advisory feeding reminder on the calendar day before a vacation
    starts. This does not change Lizard Care state or require feeding to be due.
  domain: automation
  author: Lizard Care
  source_url: https://github.com/NolanBecker/ha-lizardcare/blob/main/blueprints/automation/lizardcare/vacation_care_reminder.yaml
  homeassistant:
    min_version: 2024.10.0
  input:
    vacation_calendar:
      name: Vacation calendar
      selector:
        entity:
          filter:
            domain: calendar
    feed_button:
      name: Feed button
      description: Optional. Required to show the Mark as Fed action.
      default: ""
      selector:
        entity:
          filter:
            domain: button
    notification_target:
      name: Legacy notification target (unused)
      description: >
        Retained so existing automations load. Configure Companion notification
        services below instead.
      default: {}
      selector:
        target:
          entity:
            domain: notify
    notification_services:
      name: Companion notification services
      description: >
        Add one fully qualified service per recipient, such as
        notify.mobile_app_nolans_phone. Each service receives the same
        actionable notification.
      default: []
      selector:
        text:
          multiple: true
    reminder_time:
      name: Reminder time
      description: Time to check for vacations beginning tomorrow.
      default: "16:00:00"
      selector:
        time:
    pet_name_override:
      name: Pet name
      description: Optional pet name used by the default message.
      default: "Your pet"
      selector:
        text:
    notification_title:
      name: Notification title
      description: Optional. Leave blank to use the built-in title.
      default: ""
      selector:
        text:
    notification_message:
      name: Notification message
      description: Optional. Leave blank to use the standard message.
      default: ""
      selector:
        text:
          multiline: true
    dashboard_url:
      name: Dashboard URL
      description: Relative Home Assistant URL opened when the notification is tapped.
      default: /mobile-dashboard/pixel
      selector:
        text:

triggers:
  - trigger: time
    at: !input reminder_time
    id: reminder
  - trigger: homeassistant
    event: start
    id: startup
  - trigger: event
    event_type: mobile_app_notification_action
    id: notification_action

variables:
  vacation_calendar_entity: !input vacation_calendar
  feed_button_entity: !input feed_button
  configured_reminder_time: !input reminder_time
  configured_pet_name: !input pet_name_override
  configured_message: !input notification_message
  title_text: !input notification_title
  configured_dashboard_url: !input dashboard_url
  notification_service_list: !input notification_services
  pet_name: "{{ configured_pet_name | trim or 'Your pet' }}"
  message_text: >
    {{ configured_message | trim
       or 'Feed ' ~ pet_name ~ ' before vacation tomorrow.' }}
  reminder_time_has_passed: >
    {{ now() >= today_at(configured_reminder_time) }}
  reminder_already_handled_today: >
    {% set previous = this.attributes.last_triggered %}
    {{ previous is not none and
       as_local(previous).date() == now().date() and
       as_local(previous) >= today_at(configured_reminder_time) }}
  feeding_action_id: >
    LIZARD_CARE_{{ this.entity_id | replace('.', '_') | upper }}_FEED

actions:
  - choose:
      - conditions: >
          {{ trigger.id == 'notification_action' and
             feed_button_entity | trim != '' and
             trigger.event.data.action == feeding_action_id }}
        sequence:
          - action: button.press
            target:
              entity_id: "{{ feed_button_entity }}"
  - condition: template
    value_template: "{{ trigger.id != 'notification_action' }}"
  - condition: template
    value_template: >
      {{ trigger.id == 'reminder' or
         (trigger.id == 'startup' and reminder_time_has_passed and
          not reminder_already_handled_today) }}
  - action: calendar.get_events
    continue_on_error: true
    target:
      entity_id: "{{ vacation_calendar_entity }}"
    data:
      start_date_time: >
        {{ (today_at('00:00') + timedelta(days=1)).isoformat() }}
      end_date_time: >
        {{ (today_at('00:00') + timedelta(days=2)).isoformat() }}
    response_variable: vacation_events_response
  - variables:
      vacation_starts_tomorrow: >
        {% set calendar_result =
           (vacation_events_response | default({})).get(
             vacation_calendar_entity, {}) %}
        {% set tomorrow = (now() + timedelta(days=1)).date() %}
        {% set ns = namespace(found=false) %}
        {% for event in calendar_result.get('events', []) %}
          {% set start_value = event.start | string %}
          {% set start = as_datetime(start_value, none) %}
          {% set start_date =
             as_local(start).date() if start is not none and 'T' in start_value
             else as_datetime(start_value, none).date()
             if start is not none else none %}
          {% if start_date == tomorrow %}
            {% set ns.found = true %}
          {% endif %}
        {% endfor %}
        {{ ns.found }}
  - condition: template
    value_template: "{{ vacation_starts_tomorrow }}"
  - repeat:
      for_each: "{{ notification_service_list }}"
      sequence:
        - action: "{{ repeat.item }}"
          data:
            title: "{{ title_text | trim or 'Lizard Care — Vacation Feeding' }}"
            message: "{{ message_text }}"
            data:
              url: "{{ configured_dashboard_url }}"
              actions: >
                {{ [{'action': feeding_action_id, 'title': 'Mark as Fed'}]
                   if feed_button_entity | trim != '' else [] }}

mode: single
max_exceeded: silent
