blueprint:
  name: Lizard Care — Care Reminders
  description: >
    Send feeding, spot-clean, and full-clean reminders from Lizard Care status
    sensors. Due-today notices use the configured reminder time. Overdue notices
    begin immediately and repeat independently on local wall-clock boundaries
    while each task remains overdue.
  domain: automation
  author: Lizard Care
  source_url: https://github.com/NolanBecker/ha-lizardcare/blob/main/blueprints/automation/lizardcare/care_reminders.yaml
  homeassistant:
    min_version: 2024.10.0
  input:
    feeding_status:
      name: Feeding Status sensor
      selector:
        entity:
          filter:
            domain: sensor
    spot_clean_status:
      name: Spot Clean Status sensor
      selector:
        entity:
          filter:
            domain: sensor
    full_clean_status:
      name: Full Clean Status sensor
      selector:
        entity:
          filter:
            domain: sensor
    notification_target:
      name: Notification target
      description: Select one or more notify entities, devices, or areas.
      selector:
        target:
          entity:
            domain: notify
    reminder_time:
      name: Reminder time
      description: Time for the single daily due-today check.
      default: "19:00:00"
      selector:
        time:
    feeding_enabled:
      name: Feeding reminders
      default: true
      selector:
        boolean:
    spot_clean_enabled:
      name: Spot Clean reminders
      default: true
      selector:
        boolean:
    full_clean_enabled:
      name: Full Clean reminders
      default: true
      selector:
        boolean:
    due_today_enabled:
      name: Due-today notices
      default: true
      selector:
        boolean:
    overdue_enabled:
      name: Overdue notices and repeats
      default: true
      selector:
        boolean:
    separate_overdue_repeat_intervals:
      name: Use separate feeding and cleaning repeat intervals
      description: >
        Enable separate repeat cadences below. Leave disabled to keep using
        the existing global interval for all care tasks.
      default: false
      selector:
        boolean:
    feeding_overdue_repeat_interval_minutes:
      name: Feeding overdue repeat interval
      description: How often to repeat overdue feeding reminders.
      default: 60
      selector:
        number:
          min: 15
          max: 10080
          step: 15
          unit_of_measurement: minutes
          mode: box
    cleaning_overdue_repeat_interval_minutes:
      name: Cleaning overdue repeat interval
      description: >
        How often to repeat overdue Spot Clean and Full Clean reminders.
      default: 1440
      selector:
        number:
          min: 15
          max: 10080
          step: 15
          unit_of_measurement: minutes
          mode: box
    overdue_repeat_interval_minutes:
      name: Legacy global overdue repeat interval
      description: >
        Compatibility setting used for all tasks when separate intervals are
        disabled.
      default: 60
      selector:
        number:
          min: 15
          max: 10080
          step: 15
          unit_of_measurement: minutes
          mode: box
    overdue_repeat_interval:
      name: Legacy overdue repeat interval (hours)
      description: >
        Compatibility setting for existing automations. Leave at 0 for the
        minute-based interval above. Existing nonzero values continue to be
        interpreted as hours and take precedence.
      default: 0
      selector:
        number:
          min: 0
          max: 168
          step: 1
          unit_of_measurement: hours
          mode: box
    pet_name_override:
      name: Pet name override
      description: >
        Optional. When blank, the blueprint uses the Lizard Care device name.
      default: ""
      selector:
        text:
    notification_title_prefix:
      name: Notification title
      default: Lizard Care
      selector:
        text:

triggers:
  - trigger: time
    at: !input reminder_time
    id: due_today
  - trigger: state
    entity_id: !input feeding_status
    to: overdue
    id: feeding_overdue
  - trigger: state
    entity_id: !input spot_clean_status
    to: overdue
    id: spot_clean_overdue
  - trigger: state
    entity_id: !input full_clean_status
    to: overdue
    id: full_clean_overdue
  - trigger: time_pattern
    minutes: "*"
    id: overdue_repeat
  - trigger: homeassistant
    event: start
    id: startup

variables:
  feeding_entity: !input feeding_status
  spot_clean_entity: !input spot_clean_status
  full_clean_entity: !input full_clean_status
  feeding_is_enabled: !input feeding_enabled
  spot_clean_is_enabled: !input spot_clean_enabled
  full_clean_is_enabled: !input full_clean_enabled
  send_due_today: !input due_today_enabled
  send_overdue: !input overdue_enabled
  use_separate_repeat_intervals: !input separate_overdue_repeat_intervals
  feeding_repeat_minutes: !input feeding_overdue_repeat_interval_minutes
  cleaning_repeat_minutes: !input cleaning_overdue_repeat_interval_minutes
  repeat_minutes: !input overdue_repeat_interval_minutes
  legacy_repeat_hours: !input overdue_repeat_interval
  global_repeat_interval_minutes: >
    {% if legacy_repeat_hours | int(0) > 0 %}
      {{ legacy_repeat_hours | int * 60 }}
    {% else %}
      {{ repeat_minutes | int }}
    {% endif %}
  feeding_repeat_interval_minutes: >
    {{ feeding_repeat_minutes | int if use_separate_repeat_intervals
       else global_repeat_interval_minutes | int }}
  cleaning_repeat_interval_minutes: >
    {{ cleaning_repeat_minutes | int if use_separate_repeat_intervals
       else global_repeat_interval_minutes | int }}
  wall_clock_minutes: >
    {{ now().toordinal() * 1440 + now().hour * 60 + now().minute }}
  is_feeding_repeat_boundary: >
    {{ wall_clock_minutes | int % feeding_repeat_interval_minutes | int == 0 }}
  is_cleaning_repeat_boundary: >
    {{ wall_clock_minutes | int % cleaning_repeat_interval_minutes | int == 0 }}
  automation_ran_this_minute: >
    {% set last_run = as_timestamp(this.attributes.last_triggered, 0) %}
    {{ last_run > 0 and
       (last_run / 60) | int == (as_timestamp(now()) / 60) | int }}
  title_prefix: !input notification_title_prefix
  configured_pet_name: !input pet_name_override
  pet_name: >
    {{ configured_pet_name | trim
       or device_attr(device_id(feeding_entity), 'name')
       or 'Your pet' }}

actions:
  - choose:
      - conditions: >
          {{ trigger.id == 'due_today' and send_due_today and
             feeding_is_enabled and is_state(feeding_entity, 'due_today') }}
        sequence:
          - action: notify.send_message
            target: !input notification_target
            data:
              title: "{{ title_prefix }}"
              message: "{{ pet_name }}'s feeding is due today."
  - choose:
      - conditions: >
          {{ trigger.id == 'due_today' and send_due_today and
             spot_clean_is_enabled and
             is_state(spot_clean_entity, 'due_today') }}
        sequence:
          - action: notify.send_message
            target: !input notification_target
            data:
              title: "{{ title_prefix }}"
              message: "{{ pet_name }}'s spot clean is due today."
  - choose:
      - conditions: >
          {{ trigger.id == 'due_today' and send_due_today and
             full_clean_is_enabled and
             is_state(full_clean_entity, 'due_today') }}
        sequence:
          - action: notify.send_message
            target: !input notification_target
            data:
              title: "{{ title_prefix }}"
              message: "{{ pet_name }}'s full clean is due today."
  - choose:
      - conditions: >
          {% set elapsed = as_timestamp(now()) -
             as_timestamp(states[feeding_entity].last_changed) %}
          {{ send_overdue and feeding_is_enabled and
             is_state(feeding_entity, 'overdue') and
             (trigger.id == 'feeding_overdue' or
              (trigger.id == 'startup' and
               not automation_ran_this_minute) or
              (trigger.id == 'overdue_repeat' and
               is_feeding_repeat_boundary and
               not automation_ran_this_minute and elapsed >= 60)) }}
        sequence:
          - action: notify.send_message
            target: !input notification_target
            data:
              title: "{{ title_prefix }}"
              message: "{{ pet_name }}'s feeding is overdue."
  - choose:
      - conditions: >
          {% set elapsed = as_timestamp(now()) -
             as_timestamp(states[spot_clean_entity].last_changed) %}
          {{ send_overdue and spot_clean_is_enabled and
             is_state(spot_clean_entity, 'overdue') and
             (trigger.id == 'spot_clean_overdue' or
              (trigger.id == 'startup' and
               not automation_ran_this_minute) or
              (trigger.id == 'overdue_repeat' and
               is_cleaning_repeat_boundary and
               not automation_ran_this_minute and elapsed >= 60)) }}
        sequence:
          - action: notify.send_message
            target: !input notification_target
            data:
              title: "{{ title_prefix }}"
              message: "{{ pet_name }}'s spot clean is overdue."
  - choose:
      - conditions: >
          {% set elapsed = as_timestamp(now()) -
             as_timestamp(states[full_clean_entity].last_changed) %}
          {{ send_overdue and full_clean_is_enabled and
             is_state(full_clean_entity, 'overdue') and
             (trigger.id == 'full_clean_overdue' or
              (trigger.id == 'startup' and
               not automation_ran_this_minute) or
              (trigger.id == 'overdue_repeat' and
               is_cleaning_repeat_boundary and
               not automation_ran_this_minute and elapsed >= 60)) }}
        sequence:
          - action: notify.send_message
            target: !input notification_target
            data:
              title: "{{ title_prefix }}"
              message: "{{ pet_name }}'s full clean is overdue."

mode: queued
max: 10
max_exceeded: silent
