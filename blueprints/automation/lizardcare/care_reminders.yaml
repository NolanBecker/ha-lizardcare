blueprint:
  name: Lizard Care — Care Reminders
  description: >
    Send feeding, spot-clean, and full-clean reminders from Lizard Care status
    sensors. Due-today notices use the configured reminder time. Overdue notices
    begin immediately and repeat independently on local wall-clock boundaries
    within the configured daily notification window while each task remains
    overdue.
  domain: automation
  author: Lizard Care
  source_url: https://github.com/NolanBecker/ha-lizardcare/blob/main/blueprints/automation/lizardcare/care_reminders.yaml
  homeassistant:
    min_version: 2024.10.0
  input:
    feeding_status:
      name: Feeding Status sensor
      selector:
        entity:
          filter:
            domain: sensor
    spot_clean_status:
      name: Spot Clean Status sensor
      selector:
        entity:
          filter:
            domain: sensor
    full_clean_status:
      name: Full Clean Status sensor
      selector:
        entity:
          filter:
            domain: sensor
    cleaning_status:
      name: Combined Cleaning Status sensor
      description: >
        Optional. Select Lizard Care Cleaning Status for Alternating mode.
        Leave blank for existing Independent or Monthly automations.
      default: ""
      selector:
        entity:
          filter:
            domain: sensor
    feed_button:
      name: Feed button
      description: Optional. Required to show the Mark as Fed action.
      default: ""
      selector:
        entity:
          filter:
            domain: button
    spot_clean_button:
      name: Spot Clean button
      description: Optional. Required to show the Mark as Cleaned action.
      default: ""
      selector:
        entity:
          filter:
            domain: button
    full_clean_button:
      name: Full Clean button
      description: Optional. Required to show the Mark as Cleaned action.
      default: ""
      selector:
        entity:
          filter:
            domain: button
    notification_target:
      name: Legacy notification target (unused)
      description: >
        Retained so existing automations load. Configure Companion notification
        services below instead.
      default: {}
      selector:
        target:
          entity:
            domain: notify
    notification_services:
      name: Companion notification services
      description: >
        Add one fully qualified service per recipient, such as
        notify.mobile_app_nolans_phone. Each service receives the same
        actionable notification.
      default: []
      selector:
        text:
          multiple: true
    vacation_calendar:
      name: Vacation calendar
      description: >
        Optional. Active events on this calendar suppress notifications at
        their actual start/end times. Leave blank to disable Vacation Mode.
      default: ""
      selector:
        entity:
          filter:
            domain: calendar
    reminder_time:
      name: Reminder time
      description: >
        Time to send due-today reminders and the local wall-clock anchor for
        recurring overdue reminders.
      default: "19:00:00"
      selector:
        time:
    overdue_reminder_end_time:
      name: Overdue reminder end time
      description: >
        Inclusive local time when recurring overdue reminders stop for the
        day. Times earlier than Reminder Time create a window across midnight.
      default: "23:00:00"
      selector:
        time:
    feeding_enabled:
      name: Feeding reminders
      default: true
      selector:
        boolean:
    spot_clean_enabled:
      name: Spot Clean reminders
      default: true
      selector:
        boolean:
    full_clean_enabled:
      name: Full Clean reminders
      default: true
      selector:
        boolean:
    due_today_enabled:
      name: Due-today notices
      default: true
      selector:
        boolean:
    overdue_enabled:
      name: Overdue notices and repeats
      default: true
      selector:
        boolean:
    completion_notifications_enabled:
      name: Send completion notifications
      description: >
        Replace the active reminder with a completion confirmation. When off,
        completing care clears the stale reminder instead.
      default: true
      selector:
        boolean:
    feeding_completion_message:
      name: Feeding completion message
      description: Optional. Leave blank to use the contextual default.
      default: ""
      selector:
        text:
          multiline: true
    spot_clean_completion_message:
      name: Spot Clean completion message
      description: Optional. Leave blank to use the contextual default.
      default: ""
      selector:
        text:
          multiline: true
    full_clean_completion_message:
      name: Full Clean completion message
      description: Optional. Leave blank to use the contextual default.
      default: ""
      selector:
        text:
          multiline: true
    feeding_overdue_repeat_interval:
      name: Feeding overdue repeat interval
      description: Numeric interval between overdue feeding reminders.
      default: 1
      selector:
        number:
          min: 1
          max: 10080
          step: 1
          mode: box
    feeding_overdue_repeat_interval_unit:
      name: Feeding overdue repeat interval unit
      default: hours
      selector:
        select:
          options:
            - label: Minutes
              value: minutes
            - label: Hours
              value: hours
          mode: dropdown
    cleaning_overdue_repeat_interval:
      name: Cleaning overdue repeat interval
      description: >
        Numeric interval between overdue Spot Clean and Full Clean reminders.
      default: 24
      selector:
        number:
          min: 1
          max: 10080
          step: 1
          mode: box
    cleaning_overdue_repeat_interval_unit:
      name: Cleaning overdue repeat interval unit
      default: hours
      selector:
        select:
          options:
            - label: Minutes
              value: minutes
            - label: Hours
              value: hours
          mode: dropdown
    pet_name_override:
      name: Pet name override
      description: >
        Optional. When blank, the blueprint uses the Lizard Care device name.
      default: ""
      selector:
        text:
    notification_title_prefix:
      name: Notification title
      description: Optional. Leave blank to use the task-specific title.
      default: ""
      selector:
        text:
    notification_message:
      name: Notification message
      description: Optional. Leave blank to use the task-specific message.
      default: ""
      selector:
        text:
          multiline: true
    dashboard_url:
      name: Dashboard URL
      description: Relative Home Assistant URL opened when the notification is tapped.
      default: /mobile-dashboard/pixel
      selector:
        text:

triggers:
  - trigger: time
    at: !input reminder_time
    id: due_today
  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: !input feeding_status
    id: feeding_overdue
  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: !input spot_clean_status
    id: spot_clean_overdue
  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: !input full_clean_status
    id: full_clean_overdue
  - trigger: time_pattern
    minutes: "*"
    id: overdue_repeat
  - trigger: homeassistant
    event: start
    id: startup
  - trigger: event
    event_type: mobile_app_notification_action
    id: notification_action
  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: !input cleaning_status
    id: cleaning_status_changed
  - trigger: event
    event_type: lizardcare_care_completed
    id: care_completed

variables:
  feeding_entity: !input feeding_status
  spot_clean_entity: !input spot_clean_status
  full_clean_entity: !input full_clean_status
  cleaning_entity: !input cleaning_status
  feed_button_entity: !input feed_button
  spot_clean_button_entity: !input spot_clean_button
  full_clean_button_entity: !input full_clean_button
  feeding_is_enabled: !input feeding_enabled
  spot_clean_is_enabled: !input spot_clean_enabled
  full_clean_is_enabled: !input full_clean_enabled
  send_due_today: !input due_today_enabled
  send_overdue: !input overdue_enabled
  send_completion_notifications: !input completion_notifications_enabled
  configured_feeding_completion_message: !input feeding_completion_message
  configured_spot_completion_message: !input spot_clean_completion_message
  configured_full_completion_message: !input full_clean_completion_message
  feeding_repeat_value: !input feeding_overdue_repeat_interval
  feeding_repeat_unit: !input feeding_overdue_repeat_interval_unit
  cleaning_repeat_value: !input cleaning_overdue_repeat_interval
  cleaning_repeat_unit: !input cleaning_overdue_repeat_interval_unit
  configured_reminder_time: !input reminder_time
  configured_overdue_end_time: !input overdue_reminder_end_time
  feeding_repeat_interval_minutes: >
    {{ feeding_repeat_value | int * 60
       if feeding_repeat_unit == 'hours'
       else feeding_repeat_value | int }}
  cleaning_repeat_interval_minutes: >
    {{ cleaning_repeat_value | int * 60
       if cleaning_repeat_unit == 'hours'
       else cleaning_repeat_value | int }}
  minutes_from_reminder_anchor: >
    {% set anchor = today_at(configured_reminder_time) %}
    {% set current_minutes = now().hour * 60 + now().minute %}
    {% set anchor_minutes = anchor.hour * 60 + anchor.minute %}
    {% set wall_clock_offset = current_minutes - anchor_minutes %}
    {{ wall_clock_offset if wall_clock_offset >= 0
       else wall_clock_offset + 1440 }}
  is_feeding_repeat_boundary: >
    {{ minutes_from_reminder_anchor | int %
       feeding_repeat_interval_minutes | int == 0 }}
  is_cleaning_repeat_boundary: >
    {{ minutes_from_reminder_anchor | int %
       cleaning_repeat_interval_minutes | int == 0 }}
  is_within_overdue_window: >
    {% set start = today_at(configured_reminder_time) %}
    {% set end = today_at(configured_overdue_end_time) %}
    {% set current_minutes = now().hour * 60 + now().minute %}
    {% set start_minutes = start.hour * 60 + start.minute %}
    {% set end_minutes = end.hour * 60 + end.minute %}
    {{ start_minutes <= current_minutes <= end_minutes
       if start_minutes <= end_minutes
       else current_minutes >= start_minutes or current_minutes <= end_minutes }}
  automation_ran_this_minute: >
    {% set last_run = as_timestamp(this.attributes.last_triggered, 0) %}
    {{ last_run > 0 and
       (last_run / 60) | int == (as_timestamp(now()) / 60) | int }}
  title_prefix: !input notification_title_prefix
  configured_message: !input notification_message
  configured_dashboard_url: !input dashboard_url
  notification_service_list: !input notification_services
  configured_pet_name: !input pet_name_override
  vacation_calendar_entity: !input vacation_calendar
  pet_name: >
    {{ configured_pet_name | trim
       or device_attr(device_id(feeding_entity), 'name')
       or 'Your pet' }}
  action_id_prefix: >
    LIZARD_CARE_{{ this.entity_id | replace('.', '_') | upper }}
  feeding_action_id: "{{ action_id_prefix }}_FEED"
  spot_clean_action_id: "{{ action_id_prefix }}_SPOT_CLEAN"
  full_clean_action_id: "{{ action_id_prefix }}_FULL_CLEAN"
  pet_config_entry_id: >
    {{ config_entry_id(feeding_entity) or
       config_entry_id(spot_clean_entity) or
       config_entry_id(full_clean_entity) or '' }}
  notification_tag_prefix: >
    lizardcare_{{ pet_config_entry_id or
      (device_id(feeding_entity) or feeding_entity) | replace('.', '_') }}
  feeding_notification_tag: "{{ notification_tag_prefix }}_feeding"
  spot_clean_notification_tag: "{{ notification_tag_prefix }}_spot_clean"
  full_clean_notification_tag: "{{ notification_tag_prefix }}_full_clean"
  combined_cleaning_type: >
    {{ state_attr(cleaning_entity, 'cleaning_type')
       if cleaning_entity | trim != '' else '' }}

actions:
  - choose:
      - conditions: >
          {{ trigger.id == 'notification_action' and
             feed_button_entity | trim != '' and
             trigger.event.data.action == feeding_action_id }}
        sequence:
          - action: button.press
            target:
              entity_id: "{{ feed_button_entity }}"
      - conditions: >
          {{ trigger.id == 'notification_action' and
             spot_clean_button_entity | trim != '' and
             trigger.event.data.action == spot_clean_action_id }}
        sequence:
          - action: button.press
            target:
              entity_id: "{{ spot_clean_button_entity }}"
      - conditions: >
          {{ trigger.id == 'notification_action' and
             full_clean_button_entity | trim != '' and
             trigger.event.data.action == full_clean_action_id }}
        sequence:
          - action: button.press
            target:
              entity_id: "{{ full_clean_button_entity }}"
  - condition: template
    value_template: "{{ trigger.id != 'notification_action' }}"
  - choose:
      - conditions: >
          {{ trigger.id == 'care_completed' and
             trigger.event.data.entry_id == pet_config_entry_id and
             trigger.event.data.task in ['feeding', 'spot_clean', 'full_clean'] }}
        sequence:
          - variables:
              completed_task: "{{ trigger.event.data.task }}"
              completion_tag: >
                {{ feeding_notification_tag if completed_task == 'feeding'
                   else spot_clean_notification_tag if completed_task == 'spot_clean'
                   else full_clean_notification_tag }}
              completion_title: >
                {% if title_prefix | trim %}
                  {{ title_prefix | trim }}
                {% elif completed_task == 'feeding' %}
                  Lizard Care — Feeding
                {% elif completed_task == 'spot_clean' %}
                  Lizard Care — Spot Clean
                {% else %}
                  Lizard Care — Full Clean
                {% endif %}
              completion_message: >
                {% if completed_task == 'feeding' %}
                  {{ configured_feeding_completion_message | trim or
                     pet_name ~ ' was fed.' }}
                {% elif completed_task == 'spot_clean' %}
                  {{ configured_spot_completion_message | trim or
                     pet_name ~ "'s spot clean was completed." }}
                {% else %}
                  {{ configured_full_completion_message | trim or
                     pet_name ~ "'s full clean was completed." }}
                {% endif %}
          - repeat:
              for_each: "{{ notification_service_list }}"
              sequence:
                - choose:
                    - conditions: "{{ send_completion_notifications }}"
                      sequence:
                        - action: "{{ repeat.item }}"
                          data:
                            title: "{{ completion_title }}"
                            message: "{{ completion_message }}"
                            data:
                              url: "{{ configured_dashboard_url }}"
                              tag: "{{ completion_tag }}"
                  default:
                    - action: "{{ repeat.item }}"
                      data:
                        message: clear_notification
                        data:
                          tag: "{{ completion_tag }}"
          - stop: Care completion handled
  - variables:
      vacation_events_response: {}
      vacation_is_active: false
  - choose:
      - conditions: >
          {{ vacation_calendar_entity | trim != '' and
             states(vacation_calendar_entity) not in
             ['unknown', 'unavailable'] }}
        sequence:
          - action: calendar.get_events
            continue_on_error: true
            target:
              entity_id: "{{ vacation_calendar_entity }}"
            data:
              start_date_time: "{{ now().isoformat() }}"
              end_date_time: >
                {{ (now() + timedelta(minutes=1)).isoformat() }}
            response_variable: vacation_events_response
          - variables:
              vacation_is_active: >
                {% set calendar_result =
                   (vacation_events_response | default({})).get(
                     vacation_calendar_entity, {}) %}
                {% set events = calendar_result.get('events', []) %}
                {% set current = as_timestamp(now()) %}
                {% set ns = namespace(active=false) %}
                {% for event in events %}
                  {% set start = as_timestamp(event.start, none) %}
                  {% set end = as_timestamp(event.end, none) %}
                  {% if start is not none and end is not none and
                        current >= start and current < end %}
                    {% set ns.active = true %}
                  {% endif %}
                {% endfor %}
                {{ ns.active }}
  - choose:
      - conditions: >
          {{ cleaning_entity | trim != '' and
             trigger.id == 'due_today' and send_due_today and
             not vacation_is_active and
             is_state(cleaning_entity, 'due_today') and
             ((combined_cleaning_type == 'spot_clean' and spot_clean_is_enabled) or
              (combined_cleaning_type == 'full_clean' and full_clean_is_enabled)) }}
        sequence:
          - repeat:
              for_each: "{{ notification_service_list }}"
              sequence:
                - action: "{{ repeat.item }}"
                  data:
                    title: >
                      {{ title_prefix | trim or
                         ('Lizard Care — Spot Clean' if combined_cleaning_type == 'spot_clean'
                          else 'Lizard Care — Full Clean') }}
                    message: >
                      {{ configured_message | trim or pet_name ~
                         ("'s spot clean is due today." if combined_cleaning_type == 'spot_clean'
                          else "'s full clean is due today.") }}
                    data:
                      url: "{{ configured_dashboard_url }}"
                      tag: >
                        {{ spot_clean_notification_tag
                           if combined_cleaning_type == 'spot_clean'
                           else full_clean_notification_tag }}
                      actions: >
                        {% set button = spot_clean_button_entity
                           if combined_cleaning_type == 'spot_clean'
                           else full_clean_button_entity %}
                        {% set action = spot_clean_action_id
                           if combined_cleaning_type == 'spot_clean'
                           else full_clean_action_id %}
                        {{ [{'action': action, 'title': 'Mark as Cleaned'}]
                           if button | trim != '' else [] }}
  - choose:
      - conditions: >
          {{ trigger.id == 'due_today' and send_due_today and
             not vacation_is_active and feeding_is_enabled and
             is_state(feeding_entity, 'due_today') }}
        sequence:
          - repeat:
              for_each: "{{ notification_service_list }}"
              sequence:
                - action: "{{ repeat.item }}"
                  data:
                    title: "{{ title_prefix | trim or 'Lizard Care — Feeding' }}"
                    message: >
                      {{ configured_message | trim
                         or pet_name ~ "'s feeding is due today." }}
                    data:
                      url: "{{ configured_dashboard_url }}"
                      tag: "{{ feeding_notification_tag }}"
                      actions: >
                        {{ [{'action': feeding_action_id, 'title': 'Mark as Fed'}]
                           if feed_button_entity | trim != '' else [] }}
  - choose:
      - conditions: >
          {{ trigger.id == 'due_today' and send_due_today and
             cleaning_entity | trim == '' and
             not vacation_is_active and spot_clean_is_enabled and
             not is_state(spot_clean_entity, 'disabled') and
             is_state(spot_clean_entity, 'due_today') }}
        sequence:
          - repeat:
              for_each: "{{ notification_service_list }}"
              sequence:
                - action: "{{ repeat.item }}"
                  data:
                    title: "{{ title_prefix | trim or 'Lizard Care — Spot Clean' }}"
                    message: >
                      {{ configured_message | trim
                         or pet_name ~ "'s spot clean is due today." }}
                    data:
                      url: "{{ configured_dashboard_url }}"
                      tag: "{{ spot_clean_notification_tag }}"
                      actions: >
                        {{ [{'action': spot_clean_action_id,
                             'title': 'Mark as Cleaned'}]
                           if spot_clean_button_entity | trim != '' else [] }}
  - choose:
      - conditions: >
          {% set changed_entity = trigger.event.data.entity_id
             if trigger.id == 'cleaning_status_changed' else '' %}
          {% set old_state = trigger.event.data.old_state
             if trigger.id == 'cleaning_status_changed' else none %}
          {% set elapsed = as_timestamp(now()) -
             as_timestamp(states[cleaning_entity].last_changed)
             if cleaning_entity | trim != '' else 0 %}
          {{ cleaning_entity | trim != '' and not vacation_is_active and
             send_overdue and is_state(cleaning_entity, 'overdue') and
             ((combined_cleaning_type == 'spot_clean' and spot_clean_is_enabled) or
              (combined_cleaning_type == 'full_clean' and full_clean_is_enabled)) and
             ((trigger.id == 'cleaning_status_changed' and
               changed_entity == cleaning_entity and
               old_state is not none and old_state.state != 'overdue') or
              (trigger.id == 'startup' and is_within_overdue_window and
               not automation_ran_this_minute) or
              (trigger.id == 'overdue_repeat' and
               is_within_overdue_window and is_cleaning_repeat_boundary and
               elapsed >= 60)) }}
        sequence:
          - repeat:
              for_each: "{{ notification_service_list }}"
              sequence:
                - action: "{{ repeat.item }}"
                  data:
                    title: >
                      {{ title_prefix | trim or
                         ('Lizard Care — Spot Clean' if combined_cleaning_type == 'spot_clean'
                          else 'Lizard Care — Full Clean') }}
                    message: >
                      {{ configured_message | trim or pet_name ~
                         ("'s spot clean is overdue." if combined_cleaning_type == 'spot_clean'
                          else "'s full clean is overdue.") }}
                    data:
                      url: "{{ configured_dashboard_url }}"
                      tag: >
                        {{ spot_clean_notification_tag
                           if combined_cleaning_type == 'spot_clean'
                           else full_clean_notification_tag }}
                      actions: >
                        {% set button = spot_clean_button_entity
                           if combined_cleaning_type == 'spot_clean'
                           else full_clean_button_entity %}
                        {% set action = spot_clean_action_id
                           if combined_cleaning_type == 'spot_clean'
                           else full_clean_action_id %}
                        {{ [{'action': action, 'title': 'Mark as Cleaned'}]
                           if button | trim != '' else [] }}
  - choose:
      - conditions: >
          {{ trigger.id == 'due_today' and send_due_today and
             cleaning_entity | trim == '' and
             not vacation_is_active and full_clean_is_enabled and
             is_state(full_clean_entity, 'due_today') }}
        sequence:
          - repeat:
              for_each: "{{ notification_service_list }}"
              sequence:
                - action: "{{ repeat.item }}"
                  data:
                    title: "{{ title_prefix | trim or 'Lizard Care — Full Clean' }}"
                    message: >
                      {{ configured_message | trim
                         or pet_name ~ "'s full clean is due today." }}
                    data:
                      url: "{{ configured_dashboard_url }}"
                      tag: "{{ full_clean_notification_tag }}"
                      actions: >
                        {{ [{'action': full_clean_action_id,
                             'title': 'Mark as Cleaned'}]
                           if full_clean_button_entity | trim != '' else [] }}
  - choose:
      - conditions: >
          {% set old_state = trigger.event.data.old_state
             if trigger.id == 'feeding_overdue' else none %}
          {% set elapsed = as_timestamp(now()) -
             as_timestamp(states[feeding_entity].last_changed) %}
          {{ not vacation_is_active and send_overdue and feeding_is_enabled and
             is_state(feeding_entity, 'overdue') and
             ((trigger.id == 'feeding_overdue' and old_state is not none and
               old_state.state != 'overdue') or
              (trigger.id == 'startup' and
               is_within_overdue_window and
               not automation_ran_this_minute) or
              (trigger.id == 'overdue_repeat' and
               is_within_overdue_window and
               is_feeding_repeat_boundary and
               elapsed >= 60)) }}
        sequence:
          - repeat:
              for_each: "{{ notification_service_list }}"
              sequence:
                - action: "{{ repeat.item }}"
                  data:
                    title: "{{ title_prefix | trim or 'Lizard Care — Feeding' }}"
                    message: >
                      {{ configured_message | trim
                         or pet_name ~ "'s feeding is overdue." }}
                    data:
                      url: "{{ configured_dashboard_url }}"
                      tag: "{{ feeding_notification_tag }}"
                      actions: >
                        {{ [{'action': feeding_action_id, 'title': 'Mark as Fed'}]
                           if feed_button_entity | trim != '' else [] }}
  - choose:
      - conditions: >
          {% set old_state = trigger.event.data.old_state
             if trigger.id == 'spot_clean_overdue' else none %}
          {% set elapsed = as_timestamp(now()) -
             as_timestamp(states[spot_clean_entity].last_changed) %}
          {{ not vacation_is_active and send_overdue and spot_clean_is_enabled and
             cleaning_entity | trim == '' and
             not is_state(spot_clean_entity, 'disabled') and
             is_state(spot_clean_entity, 'overdue') and
             ((trigger.id == 'spot_clean_overdue' and old_state is not none and
               old_state.state != 'overdue') or
              (trigger.id == 'startup' and
               is_within_overdue_window and
               not automation_ran_this_minute) or
              (trigger.id == 'overdue_repeat' and
               is_within_overdue_window and
               is_cleaning_repeat_boundary and
               elapsed >= 60)) }}
        sequence:
          - repeat:
              for_each: "{{ notification_service_list }}"
              sequence:
                - action: "{{ repeat.item }}"
                  data:
                    title: "{{ title_prefix | trim or 'Lizard Care — Spot Clean' }}"
                    message: >
                      {{ configured_message | trim
                         or pet_name ~ "'s spot clean is overdue." }}
                    data:
                      url: "{{ configured_dashboard_url }}"
                      tag: "{{ spot_clean_notification_tag }}"
                      actions: >
                        {{ [{'action': spot_clean_action_id,
                             'title': 'Mark as Cleaned'}]
                           if spot_clean_button_entity | trim != '' else [] }}
  - choose:
      - conditions: >
          {% set old_state = trigger.event.data.old_state
             if trigger.id == 'full_clean_overdue' else none %}
          {% set elapsed = as_timestamp(now()) -
             as_timestamp(states[full_clean_entity].last_changed) %}
          {{ not vacation_is_active and send_overdue and full_clean_is_enabled and
             cleaning_entity | trim == '' and
             is_state(full_clean_entity, 'overdue') and
             ((trigger.id == 'full_clean_overdue' and old_state is not none and
               old_state.state != 'overdue') or
              (trigger.id == 'startup' and
               is_within_overdue_window and
               not automation_ran_this_minute) or
              (trigger.id == 'overdue_repeat' and
               is_within_overdue_window and
               is_cleaning_repeat_boundary and
               elapsed >= 60)) }}
        sequence:
          - repeat:
              for_each: "{{ notification_service_list }}"
              sequence:
                - action: "{{ repeat.item }}"
                  data:
                    title: "{{ title_prefix | trim or 'Lizard Care — Full Clean' }}"
                    message: >
                      {{ configured_message | trim
                         or pet_name ~ "'s full clean is overdue." }}
                    data:
                      url: "{{ configured_dashboard_url }}"
                      tag: "{{ full_clean_notification_tag }}"
                      actions: >
                        {{ [{'action': full_clean_action_id,
                             'title': 'Mark as Cleaned'}]
                           if full_clean_button_entity | trim != '' else [] }}

mode: queued
max: 10
max_exceeded: silent
